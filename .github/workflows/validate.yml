name: Validar

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  estatico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run validate
      - name: Construir con Eleventy
        run: npx --yes @11ty/eleventy@3.0.0
      - name: Validar herramientas migradas (salida de _site)
        run: node scripts/validate-static.mjs _site/talla-zapato.html _site/talla-panal.html _site/tallas-ropa.html _site/bolsa-hospital.html _site/juguetes-edad.html
      - name: Equivalencia con el HTML original (talla-zapato)
        run: node scripts/compare-equivalence.mjs talla-zapato
      - name: Equivalencia con el HTML original (talla-panal)
        run: node scripts/compare-equivalence.mjs talla-panal
      - name: Equivalencia con el HTML original (tallas-ropa)
        run: node scripts/compare-equivalence.mjs tallas-ropa
      - name: Equivalencia con el HTML original (bolsa-hospital)
        run: node scripts/compare-equivalence.mjs bolsa-hospital
      - name: Equivalencia con el HTML original (juguetes-edad)
        run: node scripts/compare-equivalence.mjs juguetes-edad
        
  fuentes-y-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run validate:sources
      - run: npm run test:e2e
