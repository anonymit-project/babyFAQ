name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Construir con Eleventy (herramientas migradas)
        run: npx --yes @11ty/eleventy@3.0.0

      - name: Añadir lo que aún no está migrado
        run: |
          test -f _site/talla-zapato.html
          for f in *.html; do
            [ -e "_site/$f" ] || cp "$f" _site/
          done
          rm -f _site/index_old.html
          cp CNAME favicon.svg favicon-48.png manifest.json robots.txt sitemap.xml sw.js _site/
          cp -r icons _site/icons

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
